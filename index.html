<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>S26 Ultra</title><style>
:root{--bg:#e4e4ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171c}}
:root[data-theme="dark"]{--bg:#17171c}
html,body{height:100%;margin:0}body{background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:system-ui,"Noto Sans KR",sans-serif;color:#111}
#ph{position:relative;width:370px;height:min(800px,96%);border-radius:40px;border:7px solid #222;background:#fff;overflow:hidden;display:flex;flex-direction:column}
@media(max-width:480px){#ph{width:100%;height:100%;border-radius:0;border:0}}
#st{height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:13px;font-weight:600;z-index:5;flex:none}
#st.w{color:#fff;position:absolute;top:0;left:0;right:0}
#app{flex:1;overflow:auto;position:relative;background:#fff}
#nav{height:42px;flex:none;background:#000;display:flex;justify-content:space-around;align-items:center;color:#ddd;z-index:5}
#nav button{background:none;border:0;color:#ddd;padding:8px 24px;cursor:pointer}
button{font:inherit;cursor:pointer}
.home{background:linear-gradient(160deg,#6b5a2a,#1a160b 60%,#050505);min-height:100%;position:relative;color:#fff}
.gs{margin:36px 14px 0;height:46px;border-radius:24px;background:#e7e7e7;color:#555;display:flex;align-items:center;padding:0 16px;gap:8px;font-weight:700}
.wd{position:absolute;left:50%;top:150px;width:125px;height:175px;border-radius:24px;background:linear-gradient(#1c3166,#1b4690);padding:14px;box-sizing:border-box}
.grid{position:absolute;left:0;right:0;bottom:90px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px 0;justify-items:center}
.ai{width:50px;text-align:center;font-size:10px;cursor:pointer}.ai i{display:flex;width:46px;height:46px;border-radius:14px;margin:0 auto 3px;align-items:center;justify-content:center;font:700 13px/1 system-ui;font-style:normal}
.dock{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-around}
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-weight:700;font-size:20px}
.row{display:flex;align-items:center;gap:10px}.ic{background:none;border:0;padding:4px;color:inherit}
.tb{position:absolute;bottom:0;left:0;right:0;height:52px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;font-size:10px}
.tb span{text-align:center;cursor:pointer}
.chip{display:inline-block;padding:6px 12px;border-radius:8px;background:#eee;font-size:13px;margin-right:6px}.chip.on{background:#111;color:#fff}
.th{position:relative;aspect-ratio:16/9;color:#fff;font-weight:800;font-size:22px;padding:12px;box-sizing:border-box;display:flex;align-items:flex-end}
.th b{position:absolute;right:8px;bottom:8px;background:#000a;font-size:11px;padding:2px 5px;border-radius:5px}
.vt{padding:8px 12px 14px;font-size:14px}.vt small{color:#666;display:block;margin-top:2px}
.bar{display:flex;gap:8px;padding:8px 12px;overflow:auto}.pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;background:#eee;font-size:13px;white-space:nowrap}.pill.on{background:#111;color:#fff}
.sheet{position:absolute;inset:0;background:#0006;z-index:9;display:flex;align-items:flex-end}.sheet>div{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px;box-sizing:border-box}
.toast{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;z-index:20}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 24px}.pad button{height:56px;border-radius:30px;border:0;background:#f0f0f0;font-size:22px}
.bub{max-width:70%;padding:8px 12px;border-radius:14px;margin:4px 12px;font-size:14px;background:#fff;align-self:flex-start}.bub.me{background:#fee500;align-self:flex-end}
.li{padding:12px 14px;border-bottom:1px solid #eee;font-size:14px}.li small{color:#777;display:block;margin-top:3px}
#lock{position:absolute;inset:0;z-index:30;background:linear-gradient(170deg,#3a3320,#0a0a0a);color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center}
@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.dots span{display:inline-block;width:12px;height:12px;border-radius:6px;border:2px solid #fff;margin:0 6px}.dots span.f{background:#fff}
#rc{position:absolute;inset:0;z-index:25;background:#222d;display:none;padding:50px 14px;overflow:auto;box-sizing:border-box;color:#fff}
.rcc{background:#fff;color:#111;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}
#ph{border:8px solid #0b0b0d;box-shadow:0 0 0 2px #666,0 24px 70px #000a}
#pn{position:absolute;top:10px;left:50%;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:#000;z-index:40;box-shadow:0 0 0 2px #1a1a22,inset 0 0 3px #3a4a7a}
.home{touch-action:none}.ai i{border-radius:32%!important;box-shadow:inset 0 1px 2px #fff6,0 2px 6px #0006}
#dr{position:absolute;inset:0;z-index:20;background:#000c;backdrop-filter:blur(22px);display:none;padding:56px 6px 0;box-sizing:border-box;color:#fff;animation:up .25s}
@keyframes up{from{transform:translateY(40%);opacity:0}}
.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 0;justify-items:center;margin-top:20px}
.bd{position:absolute;top:-5px;right:-5px;background:#f4511e;color:#fff;border-radius:10px;font:700 11px system-ui;padding:2px 6px;text-decoration:none}
</style></head><body><div id="ph">
<div id="pn"></div><div id="st"><span id="clk"></span><span id="bt"></span></div>
<div id="app"></div>
<div id="nav"><button onclick="recents()">&#8801;</button><button onclick="goHome()"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="none" stroke="#ddd" stroke-width="3"/></svg></button><button onclick="back()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="3"><path d="M15 5l-7 7 7 7"/></svg></button></div>
<div id="rc"></div><div id="dr"></div>
<div id="lock"></div></div>
<script>
const $=s=>document.querySelector(s),P={heart:'M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z',up:'M7 11v9H3v-9zM7 11l4-8c2 0 3 1 3 3l-1 4h6a2 2 0 0 1 2 2l-2 7a2 2 0 0 1-2 1H7',share:'M4 12v8h16v-8M12 3v12M7 8l5-5 5 5',save:'M6 3h12v18l-6-4-6 4z',plus:'M12 5v14M5 12h14',search:'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM21 21l-5-5',play:'M7 4l13 8-13 8z',tel:'M5 4h4l2 5-3 2a11 11 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z',cam:'M4 7h4l2-3h4l2 3h4v13H4zM12 10a4 4 0 1 0 0 8 4 4 0 0 0 0-8z',chat:'M4 5h16v11H9l-5 4z',fp:'M3 9a10 10 0 0 1 18 0M5 14a7 7 0 0 1 14 0v3M8 17a4 4 0 0 1 8 0v2M12 12v8',home:'M3 11l9-8 9 8v10H3z',back:'M15 5l-7 7 7 7',bell:'M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4',rep:'M4 9h14l-3-3M20 15H6l3 3'};
const I=(n,s=22,f='none',x='')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="${x}"><path d="${P[n]}"/></svg>`;
let bat=100,cur=null,rec=[],pin='',wrong=0,S={};
const A=[['yt','YouTube','#fff','#e00'],['kk','카카오톡','#fee500','#3a1d1d'],['ig','Instagram','#d6249f','#fff'],['x','X','#000','#fff'],['ph','전화','#2ecc71','#fff'],['gal','갤러리','#f3a','#fff'],['cam','카메라','#bbb','#222'],['nv','NAVER','#03c75a','#fff'],['gg','Google','#fff','#4285f4'],['ml','Melon','#00cd3c','#000'],['pt','Postype','#222','#fff'],['dc','DC','#2a3a8c','#fff'],['wv','Weverse','#1a1a1a','#1ee3c0'],['cf','다음카페','#fe2','#222'],['sms','메시지','#2a8cff','#fff']];
const G={yt:I('play',24,'#e00','color:#fff'),kk:'TALK',ig:'IG',x:'X',ph:I('tel',24,'#fff'),gal:'GAL',cam:I('cam',24),nv:'N',gg:'G',ml:'melon',pt:'PT',dc:'dc',wv:'W',cf:'cafe',sms:'SMS'};
const icon=(a,s)=>`<i style="background:${a[2]};color:${a[3]};${s||''}">${G[a[0]]}</i>`;
function tick(){const d=new Date();$('#clk').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');$('#bt').innerHTML=`<span class="row" style="gap:5px"><svg width="16" height="13" viewBox="0 0 16 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 4a10 10 0 0 1 14 0M3.5 6.8a6.5 6.5 0 0 1 9 0M6 9.5a3 3 0 0 1 4 0"/></svg><svg width="14" height="12" viewBox="0 0 14 12" fill="currentColor"><rect y="8" width="2.5" height="4"/><rect x="4" y="5" width="2.5" height="7"/><rect x="8" y="2.5" width="2.5" height="9.5"/><rect x="12" width="2" height="12"/></svg><span style="background:#8887;border-radius:10px;padding:1px 7px;font-size:12px">${bat}</span></span>`;if($('#lt'))$('#lt').textContent=$('#clk').textContent}
setInterval(tick,5000);setInterval(()=>{bat=Math.max(0,bat-1);tick();if(bat==70)notif()},60000);
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#ph').append(e);setTimeout(()=>e.remove(),1500)}
/* lock */
function lockUI(f){$('#lock').style.display='flex';$('#lock').innerHTML=`<div id="lt" style="font-size:64px;margin-top:70px;font-weight:300"></div><div style="opacity:.7">${new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'})}</div>`+(f?`<div id="dt" class="dots" style="margin-top:50px"></div><div id="hint" style="height:30px;margin:12px;color:#ffd96b"></div><div class="pad">${[1,2,3,4,5,6,7,8,9,'',0,'<'].map(k=>`<button style="background:#fff2;color:#fff;${k===''?'visibility:hidden':''}" onclick="key('${k}')">${k}</button>`).join('')}</div>`:`<div style="flex:1"></div><div onpointerdown="fpS()" onpointerup="fpE()" onpointerleave="fpE()" onpointercancel="fpE()" oncontextmenu="return false" style="cursor:pointer;margin-bottom:20px;touch-action:none;user-select:none;-webkit-user-select:none">${I('fp',64)}</div><button onclick="lockUI(1)" style="background:#fff2;color:#fff;border:0;border-radius:20px;padding:10px 20px;margin-bottom:30px">비밀번호 입력</button>`);$('#st').className='w';tick();dots()}
function dots(){const d=$('#dt');if(d)d.innerHTML=[0,1,2,3].map(i=>`<span class="${i<pin.length?'f':''}"></span>`).join('')}
function key(k){if(k==='<')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;dots();if(pin.length==4){if(pin=='1118')unlock();else{wrong++;pin='';const d=$('#dt');d.style.animation='sh .3s';setTimeout(()=>{d.style.animation='';dots()},300);if(wrong>=3)$('#hint').textContent='힌트 : 처음만난날'}}}
function unlock(){$('#lock').style.display='none';pin='';wrong=0;goHome()}
/* nav */
function goHome(){cur=null;$('#rc').style.display='none';$('#st').className='w';$('#app').innerHTML=`<div class="home"><div class="gs">${I('search',20)}<span style="flex:1"></span></div><div class="wd"><div style="font-size:50px">&#9790;</div><div style="font-size:32px;font-weight:700">19°</div><div style="font-size:12px">내일 기온은 오늘보다 낮습...</div><div style="font-size:12px;margin-top:4px">물금읍</div></div><div class="grid">${A.map(a=>`<div class="ai" onclick="openApp('${a[0]}')">${icon(a)}${a[1]}</div>`).join('')}</div><div class="dock">${[['ph','#fff','#33c'],['kk','#2a8cff','#fff']].map((a,i)=>`<div class="ai" onclick="openApp('${i?'kk':'ph'}')"><i style="background:${a[1]};color:${a[2]};width:52px;height:52px">${i?I('chat',26):I('tel',26)}</i></div>`).join('')}<div class="ai" onclick="openApp('cam')"><i style="background:#ddd;width:52px;height:52px">${I('cam',26)}</i></div></div></div>`}
function openApp(id){cur=id;if(!rec.includes(id))rec.unshift(id);$('#st').className='';draw()}
function draw(){const a=$('#app');a.innerHTML='';R[cur](a)}
function back(){if($('#rc').style.display=='block'){$('#rc').style.display='none';return}if(cur&&B[cur]&&B[cur]())return;goHome()}
function recents(){const r=$('#rc');r.style.display='block';r.innerHTML=`<div style="text-align:center;margin-bottom:12px"><button onclick="rec=[];recents()" style="border-radius:16px;border:0;padding:6px 16px">모두 닫기</button></div>`+rec.map(id=>{const a=A.find(x=>x[0]==id);return `<div class="rcc" onclick="$('#rc').style.display='none';openApp('${id}')"><div class="row">${icon(a,'width:30px;height:30px')}<b>${a[1]}</b></div></div>`}).join('')||'<p style="text-align:center">최근 앱 없음</p>'}
const B={},R={};
const hdr=(t,r='')=>`<div class="hd"><span>${t}</span><span class="row">${r}</span></div>`;
/* YouTube */
const V=[{t:'시그촬영 4년치',c:'Bambi Lover',v:'조회 2.1천',d:'2일 전',l:'4:45',g:'#2a7ba6'},{t:'어느날 아기가 나타났다 | 육아일기 EP.01 (ENG)',c:'목표달성',v:'641만',d:'5개월 전',l:'27:32',g:'#9aa6b4'},{t:'팀 우뿌즈의 자전거 대모험 | T:TIME',c:'TXT_bighit',v:'16만회',d:'1년 전',l:'4:11',g:'#4a6fa5'},{t:'생각해보면 우리 지금 납치당하는 게...',c:'TOMORROW X TOGETHER',v:'87만',d:'1년 전',l:'26:39',g:'#c4452b'}];
const Y=S.yt={tab:'home',w:null,play:0,prog:0,lk:{},dl:{},sub:{},pl:{'나중에 볼 동영상':[],'내 재생목록':[]},hist:[],sheet:0,tm:null};
const ytBar=()=>`<div class="tb">${[['home','홈','home'],['','Shorts','sh'],['','','add'],['','구독','sub'],['','내 페이지','me']].map(([i,n,k])=>k=='add'?`<span style="width:46px;height:46px;border-radius:23px;background:#eee;display:flex;align-items:center;justify-content:center">${I('plus',26)}</span>`:`<span onclick="${k=='home'||k=='me'?`Y.tab='${k}';draw()`:`toast('${n}')`}" style="${Y.tab==k?'font-weight:700':''}">${k=='home'?I('home',24,Y.tab==k?'currentColor':'none'):k=='me'?'<div style="width:24px;height:24px;border-radius:12px;background:#c9a;margin:0 auto"></div>':k=='sh'?'<div style="height:24px;font-size:18px">&#9889;</div>':'<div style="height:24px;font-size:18px">&#9776;</div>'}${n}</span>`).join('')}</div>`;
const card=(v,i)=>`<div onclick="watch(${i})" style="cursor:pointer"><div class="th" style="background:linear-gradient(135deg,${v.g},#223)">${v.t.slice(0,16)}<b>${v.l}</b></div><div class="vt"><b>${v.t}</b><small>${v.c} · ${v.v} · ${v.d}</small></div></div>`;
function watch(i){Y.w=i;Y.play=1;Y.prog=0;if(!Y.hist.includes(i))Y.hist.unshift(i);clearInterval(Y.tm);Y.tm=setInterval(()=>{if(Y.play&&Y.w!=null){Y.prog=Math.min(100,Y.prog+.5);const b=$('#pg');if(b)b.style.width=Y.prog+'%'}},1000);draw()}
R.yt=a=>{a.style.paddingBottom='56px';if(Y.w!=null){const i=Y.w,v=V[i],n=(Y.lk[i]?1:0)+1000;a.innerHTML=`<div class="th" onclick="Y.play=!Y.play;draw()" style="background:linear-gradient(135deg,${v.g},#000);height:200px;align-items:center;justify-content:center;font-size:15px">${Y.play?'재생 중...':I('play',50,'#fff')}<div style="position:absolute;bottom:0;left:0;right:0;height:4px;background:#fff4"><div id="pg" style="height:4px;width:${Y.prog}%;background:#f00"></div></div></div><div style="padding:12px"><b style="font-size:17px">${v.t}</b><small style="display:block;color:#666;margin:4px 0">${v.v} · ${v.d}</small><div class="row" style="margin:10px 0"><div style="width:36px;height:36px;border-radius:18px;background:${v.g}"></div><b style="flex:1;font-size:14px">${v.c}</b><button class="pill ${Y.sub[i]?'':'on'}" onclick="Y.sub[${i}]=!Y.sub[${i}];toast(Y.sub[${i}]?'구독했습니다':'구독 취소');draw()">${Y.sub[i]?'구독중':'구독'}</button></div><div class="bar" style="padding:0"><button class="pill ${Y.lk[i]?'on':''}" onclick="Y.lk[${i}]=!Y.lk[${i}];Y.dl[${i}]=0;draw()">${I('up',18)}${n}</button><button class="pill ${Y.dl[i]?'on':''}" onclick="Y.dl[${i}]=!Y.dl[${i}];Y.lk[${i}]=0;draw()">${I('up',18,'none','transform:rotate(180deg)')}</button><button class="pill" onclick="toast('링크가 복사되었습니다')">${I('share',18)}공유</button><button class="pill" onclick="Y.sheet=1;draw()">${I('save',18)}저장</button></div><div style="background:#f2f2f2;border-radius:12px;padding:12px;margin-top:12px;font-size:13px"><b>댓글</b> 24<div style="margin-top:6px">편집자분이 이제 그냥 고양이랑 동그라미로만 보시네ㅋㅋㅋ</div></div></div>`+(Y.sheet?`<div class="sheet"><div><b>재생목록에 저장</b>${Object.keys(Y.pl).map(k=>`<label class="li" style="display:flex;gap:10px;border:0"><input type="checkbox" ${Y.pl[k].includes(i)?'checked':''} onchange="plT('${k}',${i})">${k}</label>`).join('')}<div class="row"><input id="np" placeholder="새 재생목록 이름" style="flex:1;padding:8px"><button class="pill" onclick="const n=$('#np').value.trim();if(n){Y.pl[n]=[${i}];draw()}">추가</button></div><button class="pill on" style="margin-top:10px" onclick="Y.sheet=0;draw()">완료</button></div></div>`:'');return}
if(Y.tab=='me'){a.innerHTML=`<div style="background:linear-gradient(#fdf1d8,#fff);padding:14px"><div class="row" style="justify-content:space-between"><span class="pill">계정 &#709;</span><span>${I('bell',22)}&nbsp;${I('search',22)}</span></div><div class="row" style="margin:16px 0"><div style="width:80px;height:80px;border-radius:40px;background:#c9a"></div><div><b style="font-size:24px">카렝</b><div style="color:#996">@카렝-b7u</div></div></div><div class="row"><button class="pill on" style="flex:1;justify-content:center;padding:14px">채널 보기</button><button class="pill" style="flex:1;justify-content:center;padding:14px">Premium 구매</button></div><h3>기록 &gt;</h3><div style="display:flex;gap:10px;overflow:auto">${Y.hist.map(i=>`<div style="min-width:150px" onclick="watch(${i})"><div class="th" style="aspect-ratio:16/9;border-radius:10px;background:${V[i].g};font-size:13px">${V[i].t.slice(0,12)}</div><small>${V[i].t.slice(0,14)}</small></div>`).join('')||'<small>시청 기록이 없습니다</small>'}</div><h3>보관함</h3>${[['좋아요 표시한 동영상',Object.keys(Y.lk).filter(k=>Y.lk[k]).length],...Object.keys(Y.pl).map(k=>[k,Y.pl[k].length])].map(([n,c])=>`<div class="row li" style="border:0"><div style="width:120px;height:68px;border-radius:10px;background:#bbb"></div><div style="flex:1"><b>${n}</b><small>비공개 · 동영상 ${c}개</small></div></div>`).join('')}</div>`+ytBar();return}
a.innerHTML=`<div class="hd"><b style="color:#e00">&#9654; YouTube</b><span>${I('bell',22)}&nbsp;${I('search',22)}</span></div><div style="padding:0 12px 8px;white-space:nowrap;overflow:auto"><span class="chip on">전체</span><span class="chip">게임</span><span class="chip">팟캐스트</span><span class="chip">라이브</span></div>${V.map(card).join('')}`+ytBar()};
function plT(k,i){const l=Y.pl[k],x=l.indexOf(i);x<0?l.push(i):l.splice(x,1);toast(x<0?k+'에 저장됨':'삭제됨')}
